name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: ["22.19.0", "24"]
    runs-on: ${{ matrix.node == '22.19.0' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm pack --dry-run
